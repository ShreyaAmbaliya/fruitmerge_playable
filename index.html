<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffe8d6" />
    <meta
      name="description"
      content="Fruit Pop Fusion — drop, merge, and pop cute fruits in a physics puzzle game."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Fruit Pop Fusion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <div id="game-shell">
        <header id="hud" aria-label="Game status">
          <div class="hud-block">
            <span class="hud-label">Score</span>
            <span id="score-value" class="hud-value">0</span>
          </div>
          <div class="hud-block hud-center">
            <span class="hud-label">Next</span>
            <canvas id="next-preview" width="56" height="56" aria-hidden="true"></canvas>
          </div>
          <div class="hud-block hud-right">
            <span class="hud-label">Best</span>
            <span id="best-value" class="hud-value">0</span>
          </div>
        </header>

        <div id="canvas-wrap">
          <canvas id="game-canvas" aria-label="Fruit Pop Fusion game"></canvas>
          <div id="toast-layer" aria-live="polite"></div>
        </div>

        <footer id="controls" aria-label="Game controls">
          <button type="button" id="btn-mute" class="ctrl-btn" title="Mute" aria-label="Mute sound">
            🔊
          </button>
          <button type="button" id="btn-drop" class="ctrl-btn ctrl-drop" aria-label="Drop fruit">
            Drop
          </button>
          <button type="button" id="btn-pause" class="ctrl-btn" title="Pause" aria-label="Pause">
            ⏸
          </button>
          <button type="button" id="btn-restart" class="ctrl-btn" title="Restart" aria-label="Restart">
            ↻
          </button>
        </footer>
      </div>

      <!-- Start overlay -->
      <div id="overlay-start" class="overlay">
        <div class="panel start-panel">
          <div class="logo-mark" aria-hidden="true">
            <canvas id="logo-fruit" width="96" height="96"></canvas>
          </div>
          <h1>Fruit Pop Fusion</h1>
          <p class="tagline">Drop · Merge · Pop!</p>
          <ul class="howto">
            <li>Aim and drop matching fruits</li>
            <li>Same fruits merge into bigger ones</li>
            <li>Don’t let the pile cross the line!</li>
          </ul>
          <button type="button" id="btn-play" class="primary-btn">Play</button>
          <p class="hint">Mouse / tap to aim · Click or Space to drop</p>
        </div>
      </div>

      <!-- Pause overlay -->
      <div id="overlay-pause" class="overlay hidden">
        <div class="panel">
          <h2>Paused</h2>
          <button type="button" id="btn-resume" class="primary-btn">Resume</button>
          <button type="button" id="btn-pause-restart" class="secondary-btn">Restart</button>
        </div>
      </div>

      <!-- Game over overlay -->
      <div id="overlay-gameover" class="overlay hidden">
        <div class="panel">
          <h2>Game Over</h2>
          <p class="final-score">Score: <span id="final-score">0</span></p>
          <p class="final-best">Best: <span id="final-best">0</span></p>
          <p id="new-record" class="new-record hidden">New best score! 🎉</p>
          <button type="button" id="btn-again" class="primary-btn">Play Again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
